[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app uses hash routing, so no SPA rewrite is required — but a fallback keeps deep links safe.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Service worker must never be cached so updates roll out immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
